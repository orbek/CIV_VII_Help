[project]
name = "civ-advisor"
version = "0.1.0"
description = "Second-screen turn advisor for Civilization VI and VII, driven by the games' own log files"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
civ-advisor = "civ_advisor.cli:main"
# Retained so existing commands and the README keep working.
civ7-advisor = "civ_advisor.cli:main"

[dependency-groups]
browser = [
    "pytest-playwright>=0.5",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["civ_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The browser suite is opt-in: it needs Playwright and a downloaded browser, and it
# starts a server. `uv run pytest` stays offline and fast; run the browser checks with
#   uv sync --group browser && uv run playwright install chromium
#   uv run pytest tests/browser -p playwright.pytest_plugin
addopts = "--ignore=tests/browser"
filterwarnings = [
    # Anything new must fail loudly rather than pile up in the summary.
    "error",
    # Two deprecations third-party code emits when `fastapi.testclient` is imported.
    # Both are pinned to the exact message and the exact module that raises them, so
    # our own deprecations are still errors.
    # starlette.exceptions.StarletteDeprecationWarning, a UserWarning subclass:
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated:UserWarning:fastapi\.testclient',
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\.testclient',
    # Playwright's driver shutdown abandons a coroutine. Only the browser suite can
    # trigger it, and it says nothing about the code under test.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
